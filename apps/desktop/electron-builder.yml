appId: dev.flowstate.desktop
productName: flowstate
directories:
  output: release
  buildResources: build
files:
  - out
  - package.json
# better-sqlite3 ships a precompiled .node binary that asar can't load
# (V8 refuses to dlopen from inside an archive). Unpack it so the .node
# resolves at runtime under app.asar.unpacked/.
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/bindings/**/*"
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
